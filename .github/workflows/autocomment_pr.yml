name: Auto comment on new PR

on:
  pull_request:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Wymagane uprawnienie do pisania komentarzy
    steps:
      - name: Post welcome comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Lub token/App installation token, jeśli używasz GitHub App
          body: |
            Cześć! 👋 Dziękujemy za otwarcie nowego Pull Requesta. 
            Prosimy o upewnienie się, że kod przeszukał testy i spełnia wytyczne projektu.
